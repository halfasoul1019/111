<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --bg:#eef3f9; --bg2:#e4ecf7; --card:#ffffff; --ink:#0e1b2b; --sub:#67788f;
    --line:#e2eaf5; --cyan:#0891b2; --cyan2:#06b6d4; --cyan3:#22d3ee; --violet:#7c3aed;
    --green:#0f9d70; --red:#e11d48; --amber:#b45309;
    --shadow:0 10px 30px rgba(13,35,66,.07);
    --shadow-sm:0 2px 8px rgba(13,35,66,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0b1420; --bg2:#0e1a29; --card:#131f2e; --ink:#e6eef8; --sub:#8ea3bd;
           --line:#22303f; --shadow:0 10px 30px rgba(0,0,0,.4); --shadow-sm:0 2px 8px rgba(0,0,0,.3); }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    font-size:15.5px;line-height:1.55;
    background-image:
      radial-gradient(70% 40% at 8% -6%,rgba(34,211,238,.16),transparent 62%),
      radial-gradient(60% 36% at 100% 6%,rgba(124,58,237,.10),transparent 60%);
    background-attachment:fixed;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:100% 46px,46px 100%;opacity:.35;
    mask-image:linear-gradient(#000 0 30%,transparent 68%);
  }
  .app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 16px 96px;min-height:100vh}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

  .viewseg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;margin:0 0 12px}
  .viewseg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px;font-size:12.5px;font-weight:700;color:var(--sub);font-family:inherit;cursor:pointer}
  .viewseg button.on{background:var(--bg);color:var(--cyan);box-shadow:var(--shadow-sm)}
  .grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
  .grid6>div{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
  .grid6 b{display:block;font-size:15px;letter-spacing:-.3px;font-weight:800}
  .grid6 i{font-style:normal;font-size:10.5px;color:#54657d}
  .grid6 .ok b{color:var(--green)}
  .grid6 .no b{color:var(--red)}
  .grid6 .pr b{color:var(--cyan)}
  .warnbox{display:flex;align-items:center;gap:9px;background:rgba(225,29,72,.06);border:1px solid rgba(225,29,72,.25);border-radius:12px;padding:10px 12px;margin:0 0 12px;cursor:pointer}
  .warnbox .wt{flex:1;min-width:0}
  .warnbox .wt b{display:block;font-size:12.5px;color:var(--red)}
  .warnbox .wt span{font-size:10.5px;color:var(--sub)}
  .warnbox .go{font-size:11px;font-weight:800;color:var(--red);white-space:nowrap}
  .ovrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .ovrow:last-child{border-bottom:0}
  .ovrow .oi{flex:1;min-width:0}
  .ovrow .oi b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ovrow .oi span{font-size:10.5px;color:var(--sub)}
  .ovrow .oa{text-align:right;margin-right:2px}
  .ovrow .oa b{display:block;font-size:12.5px;font-variant-numeric:tabular-nums}
  .ovrow .oa span{font-size:10px;color:var(--red)}
  .ovbtn{border:1px solid rgba(15,157,112,.3);background:rgba(15,157,112,.08);color:var(--green);border-radius:8px;padding:5px 8px;font-size:10.5px;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap}
  .expsum{font-size:11px;color:var(--sub);padding:0 2px 10px}
  .yearcard{margin:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow-sm);cursor:pointer}
  .yearcard:active{background:var(--bg2)}
  .ych{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .ych b{font-size:12.5px}
  .ych span{font-size:10.5px;color:var(--cyan);font-weight:700}
  .ygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
  .ygrid>div{background:var(--bg);border-radius:9px;padding:6px 7px;min-width:0}
  .ygrid i{font-style:normal;font-size:9.5px;color:var(--sub);display:block;margin-bottom:1px}
  .ygrid b{display:block;font-size:13px;letter-spacing:-.2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ybars{display:flex;align-items:flex-end;gap:3px;height:32px}
  .ybars i{flex:1;background:rgba(8,145,178,.18);border-radius:2px;display:block}
  .ybars i.on{background:linear-gradient(180deg,#22d3ee,#0891b2)}
  .ybars i.has{background:rgba(8,145,178,.45)}
  .macc{border-bottom:1px solid var(--line)}
  .macc:last-child{border-bottom:0}
  .mach{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
  .mach b{font-size:12.5px;width:44px;flex:0 0 44px}
  .mach span{flex:1;font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums}
  .mach i{font-style:normal;color:var(--sub);font-size:12px;transition:.2s}
  .macc.open .mach i{transform:rotate(90deg)}
  .macd{padding:0 0 10px 0}
  .macrow{display:flex;align-items:center;gap:8px;padding:6px 0 6px 54px;font-size:11.5px;border-top:1px dashed var(--line)}
  .macrow span{flex:1;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .macrow b{font-variant-numeric:tabular-nums}
  .macrow em{font-style:normal;font-size:9.5px;padding:1px 5px;border-radius:4px}
  .macrow em.ok{color:var(--green);background:rgba(15,157,112,.1)}
  .macrow em.no{color:var(--red);background:rgba(225,29,72,.09)}
  /* header */
  header{padding:16px 0 4px}
  .hdrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .h1{font-size:22px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:7px}
  .h1 .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan2);box-shadow:0 0 10px rgba(6,182,212,.8)}
  .h1 .en{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--cyan);opacity:.8;margin-top:2px}
  .hsub{font-size:10.5px;color:var(--sub);letter-spacing:1.6px;margin-top:4px;text-transform:uppercase}
  .hactions{display:flex;gap:7px;align-items:center}
  .iconbtn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);color:var(--cyan);box-shadow:var(--shadow-sm);cursor:pointer;font-family:inherit}
  .iconbtn:active{transform:scale(.96)}

  /* month bar */
  .mbar{display:flex;align-items:center;gap:8px;margin:14px 0 12px}
  .mbtn{width:28px;height:28px;border-radius:9px;background:var(--card);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--sub);font-size:14px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow-sm)}
  .mbtn:disabled{opacity:.4}
  .mlabel{font-size:13.5px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:6px;cursor:pointer}
  .mlabel .y{font-size:10.5px;color:var(--sub);font-weight:600}
  .chip{margin-left:auto;font-size:11px;font-weight:700;color:var(--cyan);background:rgba(8,145,178,.08);
    border:1px solid rgba(8,145,178,.2);border-radius:8px;padding:4px 9px;cursor:pointer;font-family:inherit}

  /* hero */
  .hero{position:relative;padding:16px;border-radius:18px;overflow:hidden;
    background:linear-gradient(150deg,#ffffff 0%,#f2fbff 55%,#eef4ff 100%);
    border:1px solid rgba(8,145,178,.18);box-shadow:0 14px 34px rgba(13,60,90,.10)}
  @media (prefers-color-scheme:dark){ .hero{background:linear-gradient(150deg,#152334,#122231 60%,#151f33)} }
  .hero .cn{position:absolute;width:11px;height:11px;border:1.5px solid rgba(8,145,178,.45)}
  .hero .c1{top:9px;left:9px;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
  .hero .c2{top:9px;right:9px;border-left:0;border-bottom:0;border-radius:0 4px 0 0}
  .hero .c3{bottom:9px;left:9px;border-right:0;border-top:0;border-radius:0 0 0 4px}
  .hero .c4{bottom:9px;right:9px;border-left:0;border-top:0;border-radius:0 0 4px 0}

<script>
"use strict";
/* ============================================================
   业务账单 · 单文件应用
   数据：localStorage（首次运行写入表格导入的数据）
   ============================================================ */
var SEED = {"clients":["华越（郭总）","聪","李光","邓","何老师（何建）","大姐","王苏","刘光","杨总（杨宁）","宋老板","王萌","王龙","雨哲","小师弟","原龙","绒会","酒业协会","1111","南京","俞导","杨老板","宫老师","学峰"],"records":[],"expenses":[],"year":2026};

var KEY = "biz.ledger.v2";
var state = {
  tab: "list",
  month: "",        // "2026-10"
  data: null,       // {clients:[], records:[]}
  editing: null,
  voice: null,
  listView: "income",
  expEditing: null,
  compareMode: "month",
  yearA: null,
  yearB: null,
  expandYM: null
};

/* ---------------- utils ---------------- */
function $(id){ return document.getElementById(id); }
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function curMonth(){ return today().slice(0,7); }
function monthOf(dateStr){ return dateStr.slice(0,7); }
function shiftMonth(m, n){
  var p=m.split("-"), d=new Date(Number(p[0]), Number(p[1])-1+n, 1);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1);
}
function monthLabel(m){ var p=m.split("-"); return p[0]+" 年 "+Number(p[1])+" 月"; }
function monthShort(m){ return Number(m.split("-")[1])+"月"; }
function num(n){ return Math.round((Number(n)||0)*100)/100; }
function money(n, dec){
  var v=num(n), s, neg=(v<0);
  if(neg) v=Math.abs(v);
  if(dec===false || (Math.abs(v-Math.round(v))<0.005 && dec!==true)){
    s=String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,",");
  } else {
    s=v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");
  }
  return (neg?"-":"")+"¥"+s;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("on");},1700);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------------- storage ---------------- */
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var d=JSON.parse(raw); if(d && Array.isArray(d.records)) return d; }
  }catch(e){}
  return null;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state.data)); localStorage.setItem("biz.ui.month", state.month||""); }
  catch(e){ toast("保存失败：空间不足"); }
}
function resetData(){
  state.data = JSON.parse(JSON.stringify(SEED));
  state.data.records.forEach(function(r){ if(!r.id) r.id=uid(); });
  if(!state.data.expenses) state.data.expenses=[];
  save();
}

/* ---------------- queries ---------------- */
function recs(){ return state.data.records; }
function monthRecs(m){ return recs().filter(function(r){ return monthOf(r.date)===m; }); }
function sum(arr, f){ return num(arr.reduce(function(s,r){ return s+(f?f(r):r.amount); },0)); }
function statsOf(m){
  var a=monthRecs(m);
  var total=sum(a), paid=sum(a.filter(function(r){return r.paid;}));
  var unpaid=num(total-paid);
  var expense=sum(monthExp(m));
  return { total:total, paid:paid, unpaid:unpaid, count:a.length,

}

var CN_DIGIT = {"零":0,"〇":0,"一":1,"壹":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
function cnToNum(str){
  str = String(str||"").replace(/[０-９]/g,function(d){ return String("０１２３４５６７８９".indexOf(d)); }).replace(/\s/g,"");
  if(/^\d+(\.\d+)?$/.test(str)) return parseFloat(str);
  var total=0, section=0, num=0, lastUnit=1, sawZero=false;
  for(var i=0;i<str.length;i++){
    var ch=str[i];
    if(CN_DIGIT[ch]!==undefined){
      if(CN_DIGIT[ch]===0) sawZero=true;
      num=CN_DIGIT[ch];
    } else if(ch==="十"||ch==="百"||ch==="千"){
      var u = ch==="十"?10:ch==="百"?100:1000;
      if(num===0 && !sawZero) num=1;
      section += num*u; num=0; lastUnit=u; sawZero=false;
    } else if(ch==="万"){
      section += num; total += (section||1)*10000; section=0; num=0; lastUnit=10000; sawZero=false;
    }
  }
  if(num){
    if(!sawZero && lastUnit>=100 && num<10) section += num*(lastUnit/10);
    else section += num;
  }
  return total+section;
}

var ALIAS = {
  "郭总":"华越（郭总）","郭老板":"华越（郭总）","华越":"华越（郭总）",
  "杨宁":"杨总（杨宁）","杨总":"杨总（杨宁）",
  "何建":"何老师（何建）","何老师":"何老师（何建）",
  "大姐":"大姐","姐":"大姐","聪":"聪","雨哲":"雨哲","王龙":"王龙","宋老板":"宋老板",
  "酒业协会":"酒业协会","王苏":"王苏","王萌":"王萌","李光":"李光","绒会":"绒会",
  "原龙":"原龙","小师弟":"小师弟","邓":"邓","刘光":"刘光","俞导":"俞导","南京":"南京",
  "学峰":"学峰","宫老师":"宫老师","杨老板":"杨老板","1111":"1111"
};

function parseVoice(text){
  var raw = String(text||"").trim();
  var s = raw.replace(/\s+/g," ");
  var out = { client:"", amount:0, date: today(), paid:true, project:"", raw: raw };

  // 状态
  if(/未收|没收|没给|没付|欠|还没|未结|没结|没到账/.test(s)) out.paid=false;
  if(/已收|收到|到账|结清|付了|给了|收了|已付/.test(s)) out.paid=true;

  // 日期：x月y号 / x月 / 上个月 / 今天
  var dateText = "";
  var m = s.match(/(?:(\d{4})\s*年)?\s*([一二三四五六七八九十\d]{1,3})\s*月\s*(?:([一二三四五六七八九十\d]{1,3})\s*[号日])?/);
  if(m){
    var y = m[1] ? Number(m[1]) : Number(today().slice(0,4));
    var mo = cnToNum(m[2]);
    var day = m[3] ? cnToNum(m[3]) : 1;
    if(mo>=1 && mo<=12 && day>=1 && day<=31){
      out.date = y+"-"+pad2(mo)+"-"+pad2(day);
      dateText = m[0];
    }
  } else if(/上个月|上月/.test(s)){
    out.date = shiftMonth(curMonth(),-1)+"-01";
  } else if(/今天/.test(s)){
    out.date = today();
  } else if(/昨天/.test(s)){
    var d=new Date(); d.setDate(d.getDate()-1);
    out.date = d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
  }

  // 客户：长名优先
  var best="", bestLen=0;
  Object.keys(ALIAS).forEach(function(k){
    if(s.indexOf(k)>=0 && k.length>bestLen){ best=ALIAS[k]; bestLen=k.length; }
  });
  if(best) out.client=best;

  // 金额：优先带「元/块」
  var amtText="";
  var am = s.match(/([零〇一二三四五六七八九十百千万两\d]+(?:\.\d+)?)\s*(?:元|块钱|块)/);
  if(am){
    out.amount=cnToNum(am[1]); amtText=am[0];
  } else {
    // 去掉日期后找最大的数
    var rest = s.replace(dateText," ");
    var cands = rest.match(/[零〇一二三四五六七八九十百千万两\d]+(?:\.\d+)?/g)||[];
    var bestV=0, bestS="";
    cands.forEach(function(c){
      var v=cnToNum(c);
      if(v>=1 && v>bestV){ bestV=v; bestS=c; }
    });
    if(bestV>0){ out.amount=bestV; amtText=bestS; }
  }
  out.amount = num(out.amount);

  // 项目：剩余文字
  var rest2 = s;
  [dateText, amtText].forEach(function(x){ if(x) rest2=rest2.split(x).join(" "); });
  if(best){ rest2 = rest2.split(best).join(" "); Object.keys(ALIAS).forEach(function(k){ if(ALIAS[k]===best) rest2=rest2.split(k).join(" "); }); }
  rest2 = rest2.replace(/已收|未收|收到|到账|结清|没收|付了|给了|收了|没给|没付|欠着|还没|今天|昨天|上个月|上月/g," ");
  rest2 = rest2.replace(/记账|记一笔|收入|块钱|块钱|元|块/g," ");
  rest2 = rest2.replace(/\s+/g," ").trim();
  out.project = rest2.length>1 ? rest2 : "";

  // 没匹配到客户：把剩余文字里第一个像人名的词当新客户
  if(!out.client){
    var EX=["拍摄","剪辑","后期","项目","制作","宣传片","花絮","活动","视频","直播","拍照","摄影","跟拍","导播","调色","包装"];
    var toks = out.project.split(" ").filter(function(x){ return x; });
    for(var i=0;i<toks.length;i++){
      var tk=toks[i];
      if(/^[\u4e00-\u9fa5]{2,6}$/.test(tk) && EX.indexOf(tk)<0){
        out.newClient = tk;
        toks.splice(i,1);
        out.project = toks.join(" ");
        break;
      }
    }
  }
  return out;
}

    html += '<div class="panel" style="padding:4px 14px">'+
      row("应收", sa.total, sb.total, true)+
      row("已收", sa.paid, sb.paid, true)+
      row("未收", sa.unpaid, sb.unpaid, false)+
      row("笔数", sa.count, sb.count, true, false, true)+
      row("回款率", sa.rate, sb.rate, true, true)+
      row("支出", sa.expense, sb.expense, false)+
      row("利润", sa.profit, sb.profit, true)+
      '</div>';

    // 客户增减（年）
    var mapA={}, mapB={};
    yearRecs(yA).forEach(function(r){ mapA[r.client]=(mapA[r.client]||0)+num(r.amount); });
    yearRecs(yB).forEach(function(r){ mapB[r.client]=(mapB[r.client]||0)+num(r.amount); });
    var names={}; Object.keys(mapA).forEach(function(k){names[k]=1;}); Object.keys(mapB).forEach(function(k){names[k]=1;});
    var diffs=Object.keys(names).map(function(k){ return {name:k, a:mapA[k]||0, b:mapB[k]||0, d:num((mapA[k]||0)-(mapB[k]||0))}; })
      .filter(function(x){ return Math.abs(x.d)>=0.01; })
      .sort(function(x,y){ return Math.abs(y.d)-Math.abs(x.d); }).slice(0,6);
    var maxAbs = diffs.reduce(function(m2,x){ return Math.max(m2, Math.abs(x.d)); }, 1);

    html += '<div class="panel"><h3>客户增减 <span>青='+yA+' · 紫='+yB+'</span></h3>';
    if(!diffs.length) html += '<div class="empty" style="padding:16px">两年金额一致</div>';
    diffs.forEach(function(x){
      html += '<div class="cb"><div class="nm">'+esc(x.name)+'</div><div class="tr">'+
        '<i class="a" style="width:'+(x.a/maxAbs*100).toFixed(1)+'%"></i>'+
        '<i class="b" style="width:'+(x.b/maxAbs*100).toFixed(1)+'%"></i></div>'+
        '<div class="v mono" style="color:'+(x.d>=0?"var(--green)":"var(--red)")+'">'+(x.d>0?"+":"")+money(x.d).replace("¥","")+'</div></div>';
    });
    html += '</div>';

    html += yearBars(yA,yB);

    var concl;
    if(sb.total){
      var pct=(sa.total-sb.total)/sb.total*100;
      concl = yA+" 年应收 "+money(sa.total)+"，比 "+yB+" 年"+(pct>=0?"增长":"下降")+" "+Math.abs(pct).toFixed(1)+"%";
    } else {
      concl = yA+" 年应收 "+money(sa.total)+"；"+yB+" 年没有记录，无法对比";
    }
    if(sa.expense||sb.expense) concl += "；支出 "+money(sa.expense)+"，利润 "+money(sa.profit);
    html += '<div class="panel"><h3>结论 <span>自动生成</span></h3><p style="margin:0;font-size:11.5px;color:var(--sub);line-height:1.7">'+concl+'。</p></div>';
    return html;
  }

  // ---------------- 月度对比 ----------------
  var A = state.compareA || state.month;
  var B = state.compareB || shiftMonth(A,-1);
  var sa2=statsOf(A), sb2=statsOf(B);

  html += '<div class="cmonths">'+
    '<div class="cmonth" id="pickA"><b>'+monthShort(A)+'</b><span>本期</span></div>'+
    '<button class="swap" id="swap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></button>'+
    '<div class="cmonth b" id="pickB"><b>'+monthShort(B)+'</b><span>对比期</span></div></div>';

  html += '<div class="panel" style="padding:4px 14px">'+
    row("应收", sa2.total, sb2.total, true)+
    row("已收", sa2.paid, sb2.paid, true)+
    row("未收", sa2.unpaid, sb2.unpaid, false)+
    row("笔数", sa2.count, sb2.count, true, false, true)+
    row("回款率", sa2.rate, sb2.rate, true, true)+
    row("支出", sa2.expense, sb2.expense, false)+
    row("利润", sa2.profit, sb2.profit, true)+
    '</div>';

  var mapA2={}, mapB2={};
  monthRecs(A).forEach(function(r){ mapA2[r.client]=(mapA2[r.client]||0)+num(r.amount); });
  monthRecs(B).forEach(function(r){ mapB2[r.client]=(mapB2[r.client]||0)+num(r.amount); });
  var names2={}; Object.keys(mapA2).forEach(function(k){names2[k]=1;}); Object.keys(mapB2).forEach(function(k){names2[k]=1;});
  var diffs2=Object.keys(names2).map(function(k){ return {name:k, a:mapA2[k]||0, b:mapB2[k]||0, d:num((mapA2[k]||0)-(mapB2[k]||0))}; })
    .filter(function(x){ return Math.abs(x.d)>=0.01; })
    .sort(function(x,y){ return Math.abs(y.d)-Math.abs(x.d); }).slice(0,6);
  var maxAbs2 = diffs2.reduce(function(m2,x){ return Math.max(m2, Math.abs(x.d)); }, 1);

  html += '<div class="panel"><h3>客户增减 <span>青=本期 · 紫=对比期</span></h3>';
  if(!diffs2.length) html += '<div class="empty" style="padding:16px">两个月金额一致</div>';
  diffs2.forEach(function(x){
    html += '<div class="cb"><div class="nm">'+esc(x.name)+'</div><div class="tr">'+
      '<i class="a" style="width:'+(x.a/maxAbs2*100).toFixed(1)+'%"></i>'+
      '<i class="b" style="width:'+(x.b/maxAbs2*100).toFixed(1)+'%"></i></div>'+
      '<div class="v mono" style="color:'+(x.d>=0?"var(--green)":"var(--red)")+'">'+(x.d>0?"+":"")+money(x.d).replace("¥","")+'</div></div>';
  });
  html += '</div>';

  var conclusion = compareConclusion(A,B,sa2,sb2,diffs2);
  html += '<div class="panel"><h3>结论 <span>自动生成</span></h3><p style="margin:0;font-size:11.5px;color:var(--sub);line-height:1.7">'+conclusion+'</p></div>';
  return html;
}

function compareConclusion(A,B,sa,sb,diffs){
  var parts=[];
  if(sb.total){
    var pct=(sa.total-sb.total)/sb.total*100;
    parts.push(monthShort(A)+"应收 "+money(sa.total)+"，环比"+(pct>=0?"增长":"下降")+" "+Math.abs(pct).toFixed(1)+"%");
  } else {
    parts.push(monthShort(A)+"应收 "+money(sa.total));
  }
  var up=diffs.filter(function(x){return x.d>0;})[0];
  var down=diffs.filter(function(x){return x.d<0;})[0];
  if(up) parts.push("主要来自 <b>"+esc(up.name)+"</b>（+"+money(up.d).slice(1)+"）");
  if(down) parts.push("<b>"+esc(down.name)+"</b> 减少 "+money(Math.abs(down.d)).slice(1));
  if(sb.count) parts.push("回款率 "+Math.round(sb.rate*100)+"% → "+Math.round(sa.rate*100)+"%");
  return parts.join("；")+"。";
}

/* ---------------- render: stats ---------------- */
function renderStats(){
  var y=state.month.slice(0,4);
  var yr=yearRecs(y);
  var total=sum(yr), paid=sum(yr.filter(function(r){return r.paid;})), unpaid=num(total-paid);
  var rate = total? paid/total : 0;
  var avg = yr.length? total/yr.length : 0;
  var unpaidClients = {};
  yr.forEach(function(r){ if(!r.paid) unpaidClients[r.client]=(unpaidClients[r.client]||0)+num(r.amount); });
  var topUnpaid = Object.keys(unpaidClients).map(function(k){return {n:k,v:unpaidClients[k]};})
    .sort(function(a,b){return b.v-a.v;})[0];
  var byClient={}; yr.forEach(function(r){ byClient[r.client]=(byClient[r.client]||0)+num(r.amount); });
  var sortedC=Object.keys(byClient).map(function(k){return {n:k,v:byClient[k]};}).sort(function(a,b){return b.v-a.v;});
  var top1 = sortedC[0]? sortedC[0].v/total : 0;
  var top3 = sortedC.slice(0,3).reduce(function(s,x){return s+x.v;},0)/(total||1);

  var st=statsOf(state.month), prev=statsOf(shiftMonth(state.month,-1));
  var ring = prev.total? (st.total-prev.total)/prev.total : 0;

  var yrExpSum = sum(yearExp(y));
  var yrProfit = num(total-yrExpSum);
  var margin = total? yrProfit/total : 0;
  var expByCat={};
  yearExp(y).forEach(function(e){ expByCat[e.cat]=(expByCat[e.cat]||0)+num(e.amount); });
  var topExp=Object.keys(expByCat).map(function(k){return {n:k,v:expByCat[k]};}).sort(function(a,b){return b.v-a.v;})[0];
  var od2=overdueRecords();

  // 单价结构
  var buckets={};
  yr.forEach(function(r){ buckets[r.amount]=(buckets[r.amount]||0)+1; });
  var topAmt=Object.keys(buckets).map(function(k){return {a:Number(k),c:buckets[k]};}).sort(function(x,y){return y.c-x.c;})[0];

  var html = header("经营分析","AI INSIGHT · "+y+" 年","");

  html += '<div class="kpis">'+
    '<div class="kpi"><b class="mono">'+Math.round(rate*100)+'%</b><i>全年回款率</i></div>'+
    '<div class="kpi"><b class="mono">'+money(avg)+'</b><i>平均单笔 · '+yr.length+' 笔</i></div>'+
    '<div class="kpi"><b class="mono">'+Object.keys(unpaidClients).length+'</b><i>未结清客户</i></div>'+
    '<div class="kpi"><b class="mono">'+Math.round(top1*100)+'%</b><i>最大客户占比</i></div>'+
    '<div class="kpi"><b class="mono" style="color:var(--red)">'+money(yrExpSum)+'</b><i>全年支出</i></div>'+
    '<div class="kpi"><b class="mono" style="color:var(--cyan)">'+Math.round(margin*100)+'%</b><i>利润率 · 利润 '+money(yrProfit)+'</i></div>'+
  '</div>';

  html += '<div class="ins warn"><div class="ih"><b>回款风险</b><span>优先处理</span></div><p>'+
    (topUnpaid? '欠款最多的是 <em>'+esc(topUnpaid.n)+'</em>，未收 <em>'+money(topUnpaid.v)+'</em>，占全部欠款 '+Math.round(topUnpaid.v/(unpaid||1)*100)+'%。'
      : '目前没有未收款项。')+'</p></div>';

  if(od2.length){
    html += '<div class="ins warn"><div class="ih"><b>催款提醒</b><span>超过 3 个月</span></div><p>'+
      '有 <em>'+od2.length+' 笔</em>欠款已经超过 3 个月，合计 <em>'+money(sum(od2))+'</em>，最早的 '+esc(od2[0].client)+' 拖了 '+daysSince(od2[0].date)+' 天。建议先催这一笔。</p></div>';
  }
  if(topExp){
    html += '<div class="ins"><div class="ih"><b>支出结构</b><span>全年 '+money(yrExpSum)+'</span></div><p>'+
      '花得最多的是 <em>'+esc(topExp.n)+'</em>，'+money(topExp.v)+'，占支出 '+Math.round(topExp.v/(yrExpSum||1)*100)+'%；利润率 <b>'+Math.round(margin*100)+'%</b>。</p></div>';
  }
  html += '<div class="ins '+(ring>=0?"good":"warn")+'"><div class="ih"><b>环比变化</b><span>'+
    (ring>=0?"+":"")+(ring*100).toFixed(1)+'%</span></div><p>'+
    monthShort(state.month)+'应收 <b>'+money(st.total)+'</b>，'+
    (prev.total? '上月 '+money(prev.total)+'，'+(ring>=0?'增加':'减少')+' '+money(Math.abs(st.total-prev.total)) : '上月无记录')+
    '；本月已收 '+Math.round(st.rate*100)+'%，未收 <b>'+money(st.unpaid)+'</b>。</p></div>';

  html += '<div class="ins"><div class="ih"><b>客户集中度</b><span>'+(top1>0.4?'偏高':'健康')+'</span></div><p>'+
    (sortedC[0]? '最大客户 <em>'+esc(sortedC[0].n)+'</em> 占全年 '+Math.round(top1*100)+'%，前 3 家合计占 <b>'+Math.round(top3*100)+'%</b>。'
      + (top1>0.4? ' 建议把新客户做成第二增长点。':'') : '暂无数据')+'</p></div>';

  if(topAmt){
    html += '<div class="ins good"><div class="ih"><b>单价结构</b><span>最常见</span></div><p>'+
      '出现最多的是 <em>'+money(topAmt.a)+'</em>，共 '+topAmt.c+' 笔，占 '+Math.round(topAmt.c/yr.length*100)+'%。'+
      ' 可固定成「标准价」，记账更快。</p></div>';
  }

  // 12 个月柱状
  var months=[]; for(var i=11;i>=0;i--) months.push(shiftMonth(state.month,-i));
  var vals=months.map(function(m){
    var a=monthRecs(m); return { t:sum(a), p:sum(a.filter(function(r){return r.paid;})) };
  });
  var max=Math.max.apply(null, vals.map(function(v){return v.t;}).concat([1]));
  html += '<div class="panel"><h3>近 12 个月 <span>青=已收 · 紫=未收</span></h3><div class="bars">';
  vals.forEach(function(v,i){
    var h=(v.t/max)*78, hp=(v.p/max)*78;
    html += '<div class="col">'+
      '<i class="a" style="height:'+Math.max(hp,0.5).toFixed(1)+'px"></i>'+
      '<i class="b" style="height:'+Math.max(h-hp,0.5).toFixed(1)+'px"></i></div>';
  });
  html += '</div><div class="xaxis">';
  months.forEach(function(m){ html += '<span>'+(Number(m.split("-")[1]))+'</span>'; });
  html += '</div></div>';

  return html;
}

    return { name:n, total:c.total, unpaid:c.unpaid, count:c.count, last: last? monthOf(last.date):"" };

var recognition=null, recActive=false;
function toggleRec(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    $("vstat").textContent = "当前浏览器不支持语音，直接打字即可";
    toast("浏览器不支持语音识别，请打字");
    return;
  }
  if(recActive){ try{ recognition.stop(); }catch(e){} return; }
  recognition = new SR();
  recognition.lang = "zh-CN";
  recognition.continuous = true;
  recognition.interimResults = true;
  var base = $("vtext").value;
  recognition.onstart = function(){
    recActive=true;
    $("vorb").classList.add("rec"); $("vwave").classList.add("on");
    $("vstat").textContent = "正在聆听…再点一次停止";
  };
  recognition.onresult = function(e){
    var finalTxt="", interim="";
    for(var i=e.resultIndex;i<e.results.length;i++){
      var r=e.results[i];
      if(r.isFinal) finalTxt+=r[0].transcript; else interim+=r[0].transcript;
    }
    if(finalTxt) base = (base?base+" ":"")+finalTxt;
    var val = base + (interim? " "+interim : "");
    $("vtext").value = val;
    state.voice.text = val;
    renderParsed(parseVoice(val));
  };
  recognition.onerror = function(ev){
    $("vstat").textContent = "识别出错："+ev.error+"，可直接打字";
    stopRecUI();
  };
  recognition.onend = function(){ stopRecUI(); };
  try{ recognition.start(); }catch(e){ toast("无法启动麦克风"); }
}
function stopRecUI(){
  recActive=false;
  var o=$("vorb"), w=$("vwave");
  if(o){ o.classList.remove("rec"); }
  if(w){ w.classList.remove("on"); }
  var s=$("vstat"); if(s && s.textContent.indexOf("出错")<0) s.textContent="已停止，可点确认";
}

function openYearPick(target){
  state._pickingYear = target==="B" ? "B" : "A";
  var years = allYears();
  var cur = state._pickingYear==="B" ? (state.yearB||String(Number(state.yearA||state.month.slice(0,4))-1)) : (state.yearA||state.month.slice(0,4));
  var html='<div class="grab"></div><h2>选择年份<span>'+(state._pickingYear==="B"?"对比期":"本期")+'</span></h2><div class="mgrid">';
  years.forEach(function(y){
    html += '<button data-y="'+y+'" class="'+(y===cur?'on':'')+'">'+y+' 年</button>';
  });
  html += '</div><div class="acts"><button class="btn ghost" id="mcancel">取消</button></div>';
  openSheet(html);
}

function openMonthPick(target){
  state._picking = target==="B" ? "B" : "A";
  var months=allMonths();
  var cur = state._picking==="B" ? (state.compareB||shiftMonth(state.compareA||state.month,-1)) : (state.compareA||state.month);
  var html='<div class="grab"></div><h2>选择月份<span>'+(state._picking==="B"?"对比期":"本期")+'</span></h2><div class="mgrid">';
  months.forEach(function(m){
    var on = cur===m;
    html += '<button data-m="'+m+'" class="'+(on?'on':'')+'">'+Number(m.split("-")[1])+'月<span style="display:block;font-size:9px;color:var(--sub);font-weight:500">'+m.slice(0,4)+'</span></button>';
  });
  html += '</div><div class="acts"><button class="btn ghost" id="mcancel">取消</button></div>';
  openSheet(html);
}

function openExpense(exp){
  var r = exp || { id:"", cat:"车费", amount:"", date: today(), note:"" };
  state.expEditing = { id:r.id, cat:r.cat, amount:r.amount, date:r.date, note:r.note||"" };
  var html = '<div class="grab"></div><h2>'+(r.id?'编辑支出':'记支出')+'<span>车费 · 设备 · 人员</span></h2>';
  html += '<div class="flab"><span>费用类型</span><span>拍摄相关</span></div><div class="chips" id="expCats">';
  EXP_CATS.forEach(function(x){
    html += '<button class="chip2 '+(x.n===r.cat?'on':'')+'" data-ec="'+x.n+'">'+x.i+' '+x.n+'</button>';
  });
  html += '</div>';
  html += '<div class="amount"><span>¥</span><input id="fExpAmount" inputmode="decimal" placeholder="0.00" value="'+(r.amount!==""?r.amount:"")+'"></div>';
  html += '<div class="frow"><label>日期</label><input type="date" id="fExpDate" value="'+r.date+'"></div>';
  html += '<div class="frow"><label>备注</label><input id="fExpNote" maxlength="40" placeholder="如：打车去会场 / 租 FX6 / 摄影师一天" value="'+esc(r.note)+'"></div>';
  html += '<div class="acts"><button class="btn ghost" id="cancel">取消</button>'+
    (r.id?'<button class="btn danger" id="delExp">删除</button>':'')+
    '<button class="btn primary" id="saveExp">保存</button></div>';
  openSheet(html);
  setTimeout(function(){ var a=$("fExpAmount"); if(a && !r.id) a.focus(); },200);
}

function saveExpense(){
  var e=state.expEditing; if(!e) return;
  var amount=parseFloat($("fExpAmount").value);
  if(!amount || amount<=0){ toast("请输入金额"); $("fExpAmount").focus(); return; }
  var date=$("fExpDate").value || today();
  var note=$("fExpNote").value.trim();
  if(e.id){
    expRecs().forEach(function(x){ if(x.id===e.id){ x.cat=e.cat; x.amount=num(amount); x.date=date; x.note=note; } });
    toast("已更新");
  } else {
    expRecs().push({ id:uid(), cat:e.cat, amount:num(amount), date:date, note:note });
    toast("已记下支出");
  }
  save();
  state.month=date.slice(0,7); state.listView="expense";
  closeSheet(); render();
}

function delExpense(){
  var e=state.expEditing; if(!e || !e.id) return;
  if(!confirm("删除这笔支出？")) return;
  state.data.expenses=expRecs().filter(function(x){ return x.id!==e.id; });
  save(); closeSheet(); render(); toast("已删除");
}

function openClient(name){
  var a=recs().filter(function(r){ return r.client===name; })
             .sort(function(x,y){ return x.date<y.date?1:-1; });
  var total=sum(a), paid=sum(a.filter(function(r){return r.paid;}));
  var un=num(total-paid);
  var html='<div class="grab"></div><h2>'+esc(name)+'<span>'+a.length+' 笔</span></h2>';
  html+='<div class="clsum">'+
    '<div><i>累计应收</i><b>'+money(total)+'</b></div>'+
    '<div><i>已收</i><b style="color:var(--green)">'+money(paid)+'</b></div>'+
    '<div><i>未收</i><b style="color:var(--red)">'+money(un)+'</b></div>'+
  '</div>';

  if(!a.length){
    html+='<div class="empty" style="padding:18px"><b>这位客户还没有账单</b>如果这是线上版刚打开，账本是空的——先去「客户」页底部点「恢复」，导入电脑导出的备份 json</div>';
  } else {
    var byM={}, ord=[];
    a.forEach(function(r){
      var m=r.date.slice(0,7);
      if(!byM[m]){ byM[m]=[]; ord.push(m); }
      byM[m].push(r);
    });
    ord.sort().reverse();
    ord.forEach(function(m){
      var items=byM[m];
      html+='<div class="ghead" style="padding:10px 2px 6px"><div class="n"><s></s>'+m.slice(0,4)+' 年 '+Number(m.slice(5))+' 月<em>'+items.length+' 笔</em></div>'+
        '<div class="s mono">'+money(sum(items))+'</div></div>';
      items.forEach(function(r){
        html+='<div class="mrow" data-cid="'+r.id+'">'+
          '<div class="mp"><b>'+(r.project?esc(r.project):'未填项目')+'</b><span>'+r.date.slice(5).replace('-','/')+' · '+(r.paid?'已收':'未收')+'</span></div>'+
          '<div class="ma" style="color:'+(r.paid?'var(--ink)':'var(--red)')+'">'+money(r.amount)+'</div></div>';
      });
    });
  }

  html+='<div class="acts" style="margin-top:14px"><button class="btn ghost" id="cancel">关闭</button>'+
    '<button class="btn primary" id="filterClient" data-fc="'+esc(name)+'">在账单里筛选</button></div>';
  openSheet(html);
}

function openOverdue(){
  var od=overdueRecords();
  var html='<div class="grab"></div><h2>催款提醒<span>超过 3 个月未收</span></h2>';
  if(!od.length){
    html+='<div class="empty" style="padding:24px"><b>没有超期欠款</b>所有未收款都在 3 个月内</div>';
  } else {
    html+='<div style="font-size:11.5px;color:var(--sub);padding:0 2px 6px">共 '+od.length+' 笔 · '+money(sum(od))+'</div>';
    od.forEach(function(r){
      html += '<div class="ovrow"><div class="oi"><b>'+esc(r.client)+' · '+(r.project?esc(r.project):'未填项目')+'</b>'+
        '<span>'+r.date.replace(/-/g,"/")+' · 逾期 '+daysSince(r.date)+' 天</span></div>'+
        '<div class="oa"><b class="mono">'+money(r.amount)+'</b><span>未收</span></div>'+
        '<button class="ovbtn" data-mark="'+r.id+'">标记已收</button></div>';
    });
  }
  html+='<div class="acts" style="margin-top:12px"><button class="btn ghost" id="cancel">关闭</button></div>';
  openSheet(html);
}

/* ---------------- actions ---------------- */
function saveRecord(){
  var e=state.editing; if(!e) return;
  var amount=parseFloat($("fAmount").value);
  if(!amount || amount<=0){ toast("请输入金额"); $("fAmount").focus(); return; }
  var date=$("fDate").value || today();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast("日期不对"); return; }
  var cost=parseFloat($("fCost").value)||0;
  var project=$("fProject").value.trim();
  var client=e.client || (state.data.clients[0]||"");
  if(!client){ toast("请选择客户"); return; }

  if(e.id){
    recs().forEach(function(r){
      if(r.id===e.id){ r.client=client; r.project=project; r.amount=num(amount); r.date=date; r.paid=e.paid; r.cost=num(cost); }
    });
    toast("已更新");
  } else {
    recs().push({ id:uid(), client:client, project:project, amount:num(amount), date:date, paid:e.paid, cost:num(cost) });
    toast("已记下");
  }
  if(!state.data.clients.includes(client)) state.data.clients.push(client);
  save();
  state.month=date.slice(0,7);
  closeSheet();
  render();
}

function addRecordFromVoice(){
  var p=state.voice && state.voice.parsed;
  if(!p || !p.amount){ toast("还缺金额，补一句或直接改"); return; }
  var client = p.client || p.newClient;
  if(!client){ toast("没听出客户名，请在上方补一句"); return; }
  recs().push({ id:uid(), client:client, project:p.project||"语音记账", amount:num(p.amount),
                date:p.date, paid:p.paid, cost:0 });
  if(state.data.clients.indexOf(client)<0) state.data.clients.push(client);
  save();
  state.month=p.date.slice(0,7);
  closeSheet(); render(); toast("已记下 · "+client+" "+money(p.amount));
}

function delRecord(){
  var e=state.editing; if(!e||!e.id) return;
  if(!confirm("删除这条记录？")) return;
  state.data.records=recs().filter(function(r){ return r.id!==e.id; });
  save(); closeSheet(); render(); toast("已删除");
}

function exportCsv(){
  var rows=recs().slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var exps=expRecs().slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  if(!rows.length && !exps.length){ toast("没有数据"); return; }
  var lines=["日期,类型,客户/分类,项目/备注,金额,状态"];
  rows.forEach(function(r){
    lines.push([r.date,"收入",'"'+String(r.client).replace(/"/g,'""')+'"','"'+String(r.project||"").replace(/"/g,'""')+'"',
      num(r.amount).toFixed(2), r.paid?"已收":"未收"].join(","));
  });
  exps.forEach(function(e){
    lines.push([e.date,"支出",'"'+String(e.cat).replace(/"/g,'""')+'"','"'+String(e.note||"").replace(/"/g,'""')+'"',
      num(e.amount).toFixed(2),"支出"].join(","));
  });
  download("业务账单_"+today()+".csv","\uFEFF"+lines.join("\r\n"),"text/csv;charset=utf-8");
}

function download(name, text, mime){
  var blob=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },800);
}

function exportJson(){
  download("业务账单备份_"+today()+".json", JSON.stringify(state.data,null,1), "application/json");
}

function importJson(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!d || !Array.isArray(d.records)) throw new Error("bad");
      if(!d.expenses) d.expenses=[];
      state.data=d;
      save(); render(); toast("已导入 "+d.records.length+" 条收入 / "+d.expenses.length+" 笔支出");
    }catch(e){ toast("文件格式不对"); }
  };
  fr.readAsText(file);
}

/* ---------------- render root ---------------- */
function render(){
  var app=$("app"), dock=$("dock");
  var html="";
  if(state.tab==="list") html=renderList();
  else if(state.tab==="compare") html=renderCompare();
  else if(state.tab==="stats") html=renderStats();
  else html=renderClients();
  app.innerHTML=html;

  [].forEach.call(dock.querySelectorAll(".d"),function(b){
    b.classList.toggle("on", b.getAttribute("data-tab")===state.tab);
  });
  bindView();
  try{ localStorage.setItem("biz.ui.month", state.month||""); }catch(e){}
}

function bindView(){
  var r;
  if((r=$("prevM"))) r.onclick=function(){ state.month=shiftMonth(state.month,-1); render(); };
  if((r=$("nextM"))) r.onclick=function(){ if(state.month<curMonth()){ state.month=shiftMonth(state.month,1); render(); } };
  if((r=$("monthPick"))) r.onclick=function(){ openMonthPick("A"); };
  if((r=$("toCompare"))) r.onclick=function(){ state.compareA=state.month; state.compareB=shiftMonth(state.month,-1); state.tab="compare"; render(); };
  if((r=$("pickA"))) r.onclick=function(){ openMonthPick("A"); };
  if((r=$("pickB"))) r.onclick=function(){ openMonthPick("B"); };
  if((r=$("swap"))) r.onclick=function(){
    var a=state.compareA||state.month, b=state.compareB||shiftMonth(a,-1);
    state.compareA=b; state.compareB=a; render();
  };
  if((r=$("clearFilter"))) r.onclick=function(){ state.clientFilter=null; render(); };
  if((r=$("addBtn"))) r.onclick=function(){ openEdit(null); };
  if((r=$("addClient"))) r.onclick=function(){
    var name=prompt("客户 / 介绍人名字");
    if(name && name.trim()){
      var n=name.trim();
      if(state.data.clients.indexOf(n)<0){ state.data.clients.push(n); save(); render(); toast("已添加 "+n); }
      else toast("已有这个客户");
    }
  };
  if((r=$("expCsv"))) r.onclick=exportCsv;
  if((r=$("expJson"))) r.onclick=exportJson;
  if((r=$("impJson"))) r.onclick=function(){ $("fileInput").click(); };
  if((r=$("fileInput"))) r.onchange=function(){ if(this.files[0]) importJson(this.files[0]); this.value=""; };
  if((r=$("resetSeed"))) r.onclick=function(){
    if(confirm("重置为表格里的 107 笔数据？当前修改会丢失")){ resetData(); render(); toast("已重置"); }
  };

  // rows
  [].forEach.call(document.querySelectorAll(".row[data-id]"),function(el){
    el.onclick=function(){
      var id=el.getAttribute("data-id");
      var rec=recs().filter(function(x){return x.id===id;})[0];
      if(rec) openEdit(rec);
    };
  });
  [].forEach.call(document.querySelectorAll(".row[data-client]"),function(el){
    el.onclick=function(){ openClient(el.getAttribute("data-client")); };
  });
  [].forEach.call(document.querySelectorAll(".ghead[data-client]"),function(el){
    el.onclick=function(){ openClient(el.getAttribute("data-client")); };
  });
}

/* ---------------- sheet events (delegated) ---------------- */
document.addEventListener("click", function(e){
  var t=e.target;
  if(t.id==="mask"){ closeSheet(); return; }
  if(t.id==="cancel"||t.id==="vcancel"||t.id==="mcancel"){ closeSheet(); return; }
  if(t.id==="saveRec"){ saveRecord(); return; }
  if(t.id==="del"){ delRecord(); return; }
  if(t.id==="vok"){ addRecordFromVoice(); return; }
  if(t.id==="profitVal") return;
  if(t.id==="overdueBox"){ openOverdue(); return; }
  if(t.closest && t.closest("#yearCard")){ state.tab="stats"; render(); return; }
  if(t.id==="addExp"){ openExpense(null); return; }
  if(t.id==="saveExp"){ saveExpense(); return; }
  if(t.id==="delExp"){ delExpense(); return; }

  var lv=t.closest && t.closest("[data-lv]");
  if(lv){ state.listView=lv.getAttribute("data-lv"); render(); return; }

  var cm=t.closest && t.closest("[data-cm]");
  if(cm){ state.compareMode=cm.getAttribute("data-cm"); render(); return; }

  var ym=t.closest && t.closest("[data-ym]");
  if(ym){
    var key=ym.getAttribute("data-ym");
    state.expandYM = (state.expandYM===key)? null : key;
    render(); return;
  }

  if(t.id==="swapY"){
    var a2=state.yearA||state.month.slice(0,4), b2=state.yearB||String(Number(a2)-1);
    state.yearA=b2; state.yearB=a2; render(); return;
  }
  if(t.id==="pickYA"){ openYearPick("A"); return; }
  if(t.id==="pickYB"){ openYearPick("B"); return; }

  var er=t.closest && t.closest("[data-exp]");
  if(er){
    var eid=er.getAttribute("data-exp");
    var ex=expRecs().filter(function(x){return x.id===eid;})[0];
    if(ex) openExpense(ex);
    return;
  }

  var ec=t.closest && t.closest("[data-ec]");
  if(ec && state.expEditing){
    state.expEditing.cat=ec.getAttribute("data-ec");
    [].forEach.call(document.querySelectorAll("[data-ec]"),function(x){ x.classList.toggle("on",x===ec); });
    return;
  }

  var cid=t.closest && t.closest("[data-cid]");
  if(cid){
    var cidv=cid.getAttribute("data-cid");
    var crev=recs().filter(function(r){return r.id===cidv;})[0];
    if(crev) openEdit(crev);
    return;
  }
  var fc=t.closest && t.closest("[data-fc]");
  if(fc){
    state.clientFilter=fc.getAttribute("data-fc");
    state.tab="list"; closeSheet(); render(); return;
  }

  var mk=t.closest && t.closest("[data-mark]");
  if(mk){
    var mid=mk.getAttribute("data-mark");
    recs().forEach(function(r){ if(r.id===mid) r.paid=true; });
    save(); render(); openOverdue(); toast("已标记为已收");
    return;
  }

  var c=t.closest && t.closest(".chip2");
  if(c && state.editing){ state.editing.client=c.getAttribute("data-c"); 
    [].forEach.call(document.querySelectorAll(".chip2"),function(x){x.classList.toggle("on",x===c);}); return; }

  var p=t.closest && t.closest(".seg button");
  if(p && state.editing){
    var paid=p.getAttribute("data-p")==="1";
    state.editing.paid=paid;
    [].forEach.call(p.parentNode.querySelectorAll("button"),function(b){ b.classList.toggle("on",b===p); b.classList.toggle("no",b===p && !paid); });
    return;
  }

  var yb=t.closest && t.closest("[data-y]");
  if(yb){
    var yy=yb.getAttribute("data-y");
    if(state._pickingYear==="B"){ state.yearB=yy; } else { state.yearA=yy; }
    closeSheet(); render(); return;
  }

  var mb=t.closest && t.closest(".mgrid button");
  if(mb){
    var m=mb.getAttribute("data-m");
    if(state._picking==="B"){ state.compareB=m; }
    else { state.compareA=m; if(state.tab!=="compare") state.month=m; }
    closeSheet(); render(); return;
  }
});

document.addEventListener("input", function(e){
  if(e.target.id==="fAmount"||e.target.id==="fCost") updateProfit();
});

/* ---------------- mic ---------------- */
$("micBtn").onclick=function(){ openVoice(); };

[].forEach.call(document.querySelectorAll(".dock .d"), function(b){
  b.onclick=function(){
    var tab=b.getAttribute("data-tab");
    if(tab==="compare"){ state.compareA=state.month; state.compareB=shiftMonth(state.month,-1); }
    state.tab=tab; render();
  };
});

/* ---------------- boot ---------------- */
(function boot(){
  var d=load();
  if(!d){ d=JSON.parse(JSON.stringify(SEED)); d.records.forEach(function(r){ if(!r.id) r.id=uid(); }); state.data=d; save(); }
  if(!d.expenses) d.expenses=[];
  state.data=d;
  var latest=recs().map(function(r){return monthOf(r.date);}).sort().pop();
  var saved=null;
  try{ saved=localStorage.getItem("biz.ui.month"); }catch(e){}
  state.month = (saved && /^\d{4}-\d{2}$/.test(saved))? saved : curMonth();
  if(!monthRecs(state.month).length && !saved) state.month = latest || curMonth();
  state.compareA=state.month; state.compareB=shiftMonth(state.month,-1);
  render();
})();

window.addEventListener("keydown", function(e){ if(e.key==="Escape") closeSheet(); });
</script>
